# 打包 Vibe-Modeler skill 并发布 GitHub Release
#
# 两种触发方式：
# 1. 推送版本标签：  git tag v1.0.0 && git push origin v1.0.0
# 2. 手动运行：      GitHub 仓库页 → Actions → Release → Run workflow，填版本号
#
# 自己写更新内容（三种写法，按下面的顺序取第一个有内容的）：
# 1. 手动运行时填“更新内容”输入框：单行输入，用 \n 换行，例如：新增 HDRI 天空\n修复贴地浮空
# 2. 在仓库里放一个 .github/release-notes/<版本号>.md 文件（例如 .github/release-notes/v1.0.0.md），
#    写多少行都行，支持 Markdown。提交推送后再打标签或手动运行
# 3. 打带说明的标签：git tag -a v1.0.0 -m "新增 HDRI 天空" -m "修复贴地浮空"（每个 -m 是一段）
#    （或者 git tag -a v1.0.0 不带 -m，会打开编辑器写多行），再 git push origin v1.0.0
# 若以上三处都未填写，则自动调用 GitHub 接口生成本版说明（也可在手动运行时开启 auto_notes 附在自定义说明后）。
#
# 历史版本汇总与 changelogs.txt：
# - 每次发布会自动拉取所有历史 Release 的更新内容（自动剥离旧版折叠块防止套娃重复）：
#   1) 在最新 Release 页面正文中，当前版本直接展开在顶部，历史所有版本用 <details> 折叠块内嵌在下方；
#   2) 按统一格式生成包含当前版本与全部历史版本（版本号、发布时间、更新正文）的 changelogs.txt，
#      同时打进 Vibe-Modeler-<版本号>.zip 压缩包根目录（Vibe-Modeler/changelogs.txt）并作为独立附件上传到 Release 页面。
#
# 产物：
# - Vibe-Modeler-<版本号>.zip（内含 Vibe-Modeler/changelogs.txt、VERSION 及所有已跟踪 skill 文件）
# - Vibe-Modeler-<版本号>.zip.sha256
# - changelogs.txt

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 v1.0.0；该标签不存在时会在当前提交上自动创建）"
        required: true
        type: string
      title:
        description: "Release 标题（不填就用版本号）"
        required: false
        type: string
        default: ""
      notes:
        description: "更新内容（用 \\n 换行；不填则依次查找 .github/release-notes/<版本号>.md、标签说明，都没有则自动生成）"
        required: false
        type: string
        default: ""
      auto_notes:
        description: "当已填写自定义更新内容时，是否仍在后面附上 GitHub 自动生成的变更列表"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "标记为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
      AUTO_NOTES: ${{ github.event.inputs.auto_notes || 'false' }}
      # 用户输入只通过环境变量传给脚本，不直接拼进命令，防止输入里的特殊字符被当成命令执行
      TITLE_INPUT: ${{ github.event.inputs.title }}
      NOTES_INPUT: ${{ github.event.inputs.notes }}
      PKG_NAME: Vibe-Modeler
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取完整标签信息
        # checkout 在标签触发时会把带说明的标签当成普通标签拉下来，说明文字会丢，这里重新拉一次
        run: git fetch --force --tags origin

      - name: 检查版本号格式
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不对：$VERSION（应为 v1.0.0、v1.2.0-beta.1 这样的格式）"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION 已经存在，请换一个版本号"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查 skill 文件完整、脚本没有语法错误
        run: |
          test -f SKILL.md || { echo "::error::缺少 SKILL.md"; exit 1; }
          head -n 5 SKILL.md | grep -q "^name:" || { echo "::error::SKILL.md 开头缺少 name 字段"; exit 1; }
          head -n 5 SKILL.md | grep -q "^description:" || { echo "::error::SKILL.md 开头缺少 description 字段"; exit 1; }
          python -m py_compile scripts/*.py templates/*.py
          # 模板代码片段本身也要能通过语法检查（它们以字符串形式存在，py_compile 查不到）
          python - <<'EOF'
          import ast, importlib, sys
          sys.path.insert(0, ".")
          bad = 0
          for mod_name, attr in [("templates.materials", "MATERIAL_SNIPPETS"),
                                 ("templates.geo_nodes", "GEO_NODES_SNIPPETS"),
                                 ("templates.modeling", "MODELING_SNIPPETS"),
                                 ("templates.spatial_archetypes", "SPATIAL_ARCHETYPE_SNIPPETS"),
                                 ("templates.placement", "PLACEMENT_SNIPPETS"),
                                 ("templates.render_pipeline", "RENDER_PIPELINE_SNIPPETS"),
                                 ("templates.lighting_rigs", "LIGHTING_RIG_SNIPPETS")]:
              for key, code in getattr(importlib.import_module(mod_name), attr).items():
                  try:
                      ast.parse(code)
                  except SyntaxError as e:
                      bad += 1
                      print(f"::error::{mod_name}.{attr}['{key}'] 语法错误: {e}")
          sys.exit(1 if bad else 0)
          EOF

      - name: 整理当前与历史版本更新内容并生成 changelogs.txt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import datetime
          import json
          import os
          import re
          import subprocess

          version = os.environ["VERSION"].strip()
          title_input = (os.environ.get("TITLE_INPUT") or "").strip() or version
          notes_input = os.environ.get("NOTES_INPUT") or ""
          auto_notes_flag = (os.environ.get("AUTO_NOTES") or "false").lower() == "true"
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          runner_temp = os.environ.get("RUNNER_TEMP") or "/tmp"
          github_env = os.environ.get("GITHUB_ENV")

          HIST_START = "<!-- HISTORY_RELEASE_NOTES_START -->"
          HIST_END = "<!-- HISTORY_RELEASE_NOTES_END -->"

          def strip_history_block(text):
              if not text:
                  return ""
              if HIST_START in text:
                  text = text.split(HIST_START, 1)[0]
              # 兼容可能手动写下的历史折叠标题
              text = re.sub(
                  r"\n*---\s*\n+<details>\s*\n*<summary>[^<]*历史版本更新记录[^<]*</summary>.*\Z",
                  "",
                  text,
                  flags=re.DOTALL,
              )
              return text.strip()

          def run_cmd(cmd):
              res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              return res.returncode, res.stdout.strip(), res.stderr.strip()

          # 1. 获取当前版本的自定义更新内容
          custom_notes = ""
          source = "无"
          repo_notes_path = f".github/release-notes/{version}.md"
          if notes_input.strip():
              custom_notes = notes_input.replace("\\n", "\n").strip()
              source = "手动输入"
          elif os.path.isfile(repo_notes_path):
              with open(repo_notes_path, "r", encoding="utf-8") as f:
                  custom_notes = f.read().strip()
              source = repo_notes_path
          else:
              rc, obj_type, _ = run_cmd(["git", "cat-file", "-t", f"refs/tags/{version}"])
              if rc == 0 and obj_type == "tag":
                  _, subj, _ = run_cmd(["git", "tag", "-l", "--format=%(contents:subject)", version])
                  _, body, _ = run_cmd(["git", "tag", "-l", "--format=%(contents:body)", version])
                  parts = [p.strip() for p in (subj, body) if p and p.strip()]
                  if parts:
                      custom_notes = "\n\n".join(parts)
                      source = "标签说明"

          # 2. 若未提供自定义更新内容（或显式勾选了 auto_notes），调用 GitHub generate-notes 接口
          generated_notes = ""
          if not custom_notes or auto_notes_flag:
              rc, out, _ = run_cmd([
                  "gh", "api", f"repos/{repo}/releases/generate-notes",
                  "-f", f"tag_name={version}",
                  "-f", f"target_commitish={sha}",
                  "--jq", ".body"
              ])
              if rc == 0 and out:
                  generated_notes = out.strip()

          if custom_notes and generated_notes and auto_notes_flag:
              current_notes = f"{custom_notes}\n\n{generated_notes}"
              source = f"{source} + GitHub 自动生成"
          elif custom_notes:
              current_notes = custom_notes
          elif generated_notes:
              current_notes = generated_notes
              source = "GitHub 自动生成"
          else:
              current_notes = f"发布版本 {version}。"
              source = "默认说明"

          current_notes = strip_history_block(current_notes)
          now_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          # 3. 拉取所有已发布的历史 GitHub Releases
          historical_entries = []
          rc, rel_json, _ = run_cmd(["gh", "api", "--paginate", f"repos/{repo}/releases"])
          if rc == 0 and rel_json:
              try:
                  # --paginate 可能返回多个数组拼接，优先用 jq 合并或解析
                  rc_jq, merged_json, _ = run_cmd([
                      "gh", "api", "--paginate", f"repos/{repo}/releases", "--jq", ".[]"
                  ])
                  releases = []
                  if rc_jq == 0 and merged_json:
                      for line in merged_json.splitlines():
                          line = line.strip()
                          if line:
                              releases.append(json.loads(line))
                  else:
                      releases = json.loads(rel_json)
                  for rel in releases:
                      if rel.get("draft"):
                          continue
                      tag = (rel.get("tag_name") or "").strip()
                      if not tag or tag == version:
                          continue
                      pub_raw = rel.get("published_at") or rel.get("created_at") or ""
                      pub_str = pub_raw.replace("T", " ").replace("Z", " UTC") if pub_raw else "未知时间"
                      rel_title = (rel.get("name") or "").strip() or tag
                      rel_body = strip_history_block(rel.get("body") or "") or f"发布版本 {tag}。"
                      historical_entries.append({
                          "version": tag,
                          "title": rel_title,
                          "date": pub_str,
                          "body": rel_body,
                      })
              except Exception as exc:
                  print(f"::warning::解析历史 Release 列表失败: {exc}")

          # 4. 生成当前 Release 页面完整 Markdown（顶部当前版本 + 底部折叠全部历史版本）
          release_md_parts = [current_notes]
          if historical_entries:
              hist_md = [
                  "",
                  "---",
                  "",
                  HIST_START,
                  "<details>",
                  f"<summary>📚 历史版本更新记录（共 {len(historical_entries)} 个版本）</summary>",
                  "",
              ]
              for item in historical_entries:
                  header_title = item["version"] if item["title"] == item["version"] else f"{item['version']} - {item['title']}"
                  hist_md.append(f"### {header_title}（{item['date']}）")
                  hist_md.append("")
                  hist_md.append(item["body"])
                  hist_md.append("")
                  hist_md.append("---")
                  hist_md.append("")
              hist_md.append("</details>")
              hist_md.append(HIST_END)
              release_md_parts.append("\n".join(hist_md))

          release_notes_file = os.path.join(runner_temp, "release_notes.md")
          with open(release_notes_file, "w", encoding="utf-8") as f:
              f.write("\n".join(release_md_parts).strip() + "\n")

          # 5. 按统一格式生成 changelogs.txt（包含当前版本 + 所有历史版本）
          all_versions = [
              {
                  "version": version,
                  "title": title_input,
                  "date": now_str,
                  "body": current_notes,
              }
          ] + historical_entries

          sep_major = "=" * 80
          sep_minor = "-" * 80
          changelog_lines = [
              sep_major,
              f"Vibe-Modeler 版本更新日志 (Changelogs)",
              f"最新版本号: {version}",
              f"生成时间:   {now_str}",
              f"收录版本数: {len(all_versions)}",
              sep_major,
              "",
          ]
          for entry in all_versions:
              changelog_lines.extend([
                  f"[{entry['version']}] - {entry['date']}",
                  f"版本标题: {entry['title']}",
                  sep_minor,
                  entry["body"],
                  "",
                  sep_major,
                  "",
              ])

          changelogs_file = os.path.join(runner_temp, "changelogs.txt")
          with open(changelogs_file, "w", encoding="utf-8") as f:
              f.write("\n".join(changelog_lines).rstrip() + "\n")

          print(f"更新内容来源：{source}（附带历史版本数：{len(historical_entries)}）")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"NOTES_FILE={release_notes_file}\n")
                  env_f.write(f"CHANGELOGS_FILE={changelogs_file}\n")
                  env_f.write(f"NOTES_SOURCE={source}\n")
                  env_f.write(f"HISTORY_COUNT={len(historical_entries)}\n")
          EOF

      - name: 打包（内嵌 VERSION 与 changelogs.txt）
        run: |
          rm -rf build dist && mkdir -p build dist
          ZIP="dist/${PKG_NAME}-${VERSION}.zip"
          CHANGELOG_DIST="dist/changelogs.txt"
          # 只取 git 已跟踪的文件（.gitattributes 里标了 export-ignore 的不要）
          git archive --format=tar --prefix="${PKG_NAME}/" HEAD | tar -x -C build
          echo "$VERSION" > "build/${PKG_NAME}/VERSION"
          cp "$CHANGELOGS_FILE" "build/${PKG_NAME}/changelogs.txt"
          cp "$CHANGELOGS_FILE" "$CHANGELOG_DIST"
          (cd build && zip -rq "../$ZIP" "${PKG_NAME}")
          (cd dist && sha256sum "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")
          echo "包内文件："
          unzip -l "$ZIP"
          {
            echo "ZIP=$ZIP"
            echo "CHANGELOG_DIST=$CHANGELOG_DIST"
          } >> "$GITHUB_ENV"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="${TITLE_INPUT:-$VERSION}"
          ARGS=(--title "$TITLE" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]] || [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" "$ZIP" "$ZIP.sha256" "$CHANGELOG_DIST" "${ARGS[@]}"
          {
            echo "### 已发布 $VERSION"
            echo "- 标题：$TITLE"
            echo "- 更新内容来源：$NOTES_SOURCE（内嵌历史版本：$HISTORY_COUNT 个）"
            echo "- 安装包：\`$(basename "$ZIP")\`（已内嵌 \`changelogs.txt\`）"
            echo "- 独立变更日志：\`changelogs.txt\`"
            echo "- 校验：\`$(cat "$ZIP.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
